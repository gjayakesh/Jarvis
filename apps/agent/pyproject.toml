[project]
name = "jarvis-agent"
version = "0.1.0"
description = "JARVIS local agent: read-only PC evidence, diagnostic rules and evidence-grounded assistant (loopback only)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=6.0",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["collectors/*.ps1", "actions/scripts/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
